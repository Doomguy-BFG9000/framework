version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - depguard
    - forbidigo
    - gocognit
    - lll
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
    lll:
      line-length: 120
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: exported
    depguard:
      rules:
        auth-purity:
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/gopherium/framework/gonsole$
            - github.com/gopherium/framework/gonsole/auth$
            - github.com/gopherium/framework/dbkit/postgres$
            - github.com/gopherium/gouncer/authkit/postgres$
            - github.com/jackc/pgx/v5
        test-purity:
          list-mode: strict
          files:
            - $test
          allow:
            - $gostd
            - github.com/gopherium/framework/gonsole$
            - github.com/gopherium/framework/gonsole/auth$
            - github.com/gopherium/framework/gonsole/auth/postgres$
            - github.com/gopherium/framework/gonsole/auth/recordstest$
            - github.com/gopherium/framework/gonsole/testkit$
            - github.com/gopherium/framework/dbkit$
            - github.com/gopherium/framework/dbkit/postgres$
            - github.com/gopherium/framework/dbkit/postgres/pgtest$
            - github.com/gopherium/gouncer$
            - github.com/gopherium/gouncer/authkit/postgres$
            - github.com/gopherium/gouncer/authkit/postgres/testdb$
            - github.com/jackc/pgx/v5
            - github.com/peterldowns/pgtestdb$
            - github.com/pressly/goose/v3/lock$
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^sql\.Open(DB)?$
          pkg: ^database/sql$
          msg: open PostgreSQL through pgxpool.New or pgx's stdlib.OpenDB
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gopherium/framework
